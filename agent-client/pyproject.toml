[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-agent"
version = "0.1.0"
description = "Core AI Incident Triage & Release Readiness Agent (MCP, LLM, guardrails, CLI, evals)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
incident-agent = "incident_agent.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["incident_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
