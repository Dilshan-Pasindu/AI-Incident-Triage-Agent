[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-agent-web"
version = "0.1.0"
description = "FastAPI Web Backend & SSE Streaming for Incident Triage Agent"
requires-python = ">=3.11"
dependencies = [
    "incident-agent",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
incident-web = "app.server:start_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.pyrefly]
search-path = ["../agent-client", "."]
python-interpreter-path = "../.venv/bin/python"
infer-with-first-use = false

