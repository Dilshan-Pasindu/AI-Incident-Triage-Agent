name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-mcp:
    name: Rust MCP Server (Format, Clippy, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-server

      - name: Check code formatting
        run: cargo fmt --check --manifest-path mcp-server/Cargo.toml

      - name: Run Clippy linter
        run: cargo clippy --manifest-path mcp-server/Cargo.toml -- -D warnings

      - name: Run Rust unit and concurrency tests
        run: cargo test --manifest-path mcp-server/Cargo.toml -- --nocapture

      - name: Build release binary
        run: cargo build --release --manifest-path mcp-server/Cargo.toml

      - name: Upload Rust MCP server binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-telemetry-mcp-linux
          path: mcp-server/target/release/ops-telemetry-mcp
          retention-days: 7

  frontend-ui:
    name: Frontend React Web UI (Typecheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web-ui

      - name: Run TypeScript typecheck and Vite production build
        run: npm run build --prefix web-ui

      - name: Upload built UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-dist
          path: web-ui/dist
          retention-days: 7

  python-suite:
    name: Python Suite (Tests, Boundary Check, Typecheck & Evals)
    runs-on: ubuntu-latest
    needs: [rust-mcp]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            agent-client/pyproject.toml
            web-backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-client/package-lock.json

      - name: Install filesystem MCP server dependencies
        run: npm ci --prefix agent-client

      - name: Download Rust MCP server binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-telemetry-mcp-linux
          path: mcp-server/target/release/

      - name: Ensure Rust binary is executable
        run: |
          chmod +x mcp-server/target/release/ops-telemetry-mcp
          ls -la mcp-server/target/release/ops-telemetry-mcp

      - name: Set up virtual environment and install packages
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel pyright
          pip install -e "agent-client[test]"
          pip install -e "web-backend[test]"

      - name: Enforce architectural boundary (Zero web deps in core)
        run: |
          . .venv/bin/activate
          pytest agent-client/tests/test_no_web_imports.py -v

      - name: Run Pyright static type check
        run: |
          . .venv/bin/activate
          pyright

      - name: Run full Pytest test suite (Core + Web)
        run: |
          . .venv/bin/activate
          pytest -v

      - name: Run evaluation benchmark smoke test
        run: |
          . .venv/bin/activate
          python -m incident_agent.eval_suite --repeat 1
